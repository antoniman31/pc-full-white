name: Contrôles

# Vérifie que data/prices.json est cohérent (totaux recalculés, historique,
# pas de NaN ni de prix à 0 par erreur) et que site/app.js a une syntaxe valide.
#
# Tourne sur chaque push vers main et sur chaque Pull Request, y compris celles
# que le scraper mensuel ouvre : un prix mal extrait donne un check rouge AVANT
# la fusion. Un push signé par le GITHUB_TOKEN d'un autre workflow ne déclenche
# pas celui-ci, ce qui est voulu (le scraper passe par une PR, pas par un push).
on:
  pull_request:
  push:
    branches: [main]

# Lecture seule : ces contrôles ne modifient jamais le dépôt.
permissions:
  contents: read

# Un push qui en suit un autre de près rend les contrôles du premier sans objet.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cohérence de prices.json
        run: python3 scripts/check_prices.py data/prices.json

      - name: Syntaxe de app.js
        run: node --check site/app.js

      - name: Dépendances du scraper
        run: pip install -r scraper/requirements.txt

      - name: Tests du scraper
        run: python3 -m unittest discover -s scraper/tests

  # Accessibilité : axe-core sur chaque onglet, plus les contrôles qu'axe ne fait
  # pas (cibles tactiles de 48px, parcours clavier, retour arrière du navigateur).
  # Job séparé des contrôles de données : ses dépendances sont plus lourdes et son
  # échec se lit indépendamment.
  accessibilite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Installation de Chromium
        run: npx playwright install --with-deps chromium

      - name: Contrôles d'accessibilité
        run: npx playwright test

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
