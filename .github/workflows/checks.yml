name: Contrôles

# Vérifie que data/prices.json est cohérent (totaux recalculés, historique,
# pas de NaN ni de prix à 0 par erreur) et que site/app.js a une syntaxe valide.
#
# Tourne sur chaque push vers main et sur chaque Pull Request, y compris celles
# que le scraper mensuel ouvre : un prix mal extrait donne un check rouge AVANT
# la fusion. Un push signé par le GITHUB_TOKEN d'un autre workflow ne déclenche
# pas celui-ci, ce qui est voulu (le scraper passe par une PR, pas par un push).
on:
  pull_request:
  push:
    branches: [main]

# Lecture seule : ces contrôles ne modifient jamais le dépôt.
permissions:
  contents: read

# Un push qui en suit un autre de près rend les contrôles du premier sans objet.
concurrency:
  group: controles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cohérence de prices.json
        run: python3 scripts/check_prices.py data/prices.json

      - name: Syntaxe de app.js
        run: node --check site/app.js

      # Logique pure de app.js (nettoyage des changements locaux, calcul du budget), sans navigateur : moins d'une seconde.
      - name: Tests de la logique de app.js
        run: node --test tests/unit/logique.mjs tests/unit/couleurs.mjs

      # Sans numéro de version, un navigateur garde l'ancien app.js après une mise à jour.
      - name: Numéros de version des fichiers du site
        run: python3 scripts/stamp_assets.py --check

      - name: Dépendances du scraper
        run: pip install -r scraper/requirements.txt

      - name: Tests du scraper
        run: python3 -m unittest discover -s scraper/tests

  # Accessibilité : axe-core sur chaque onglet, plus les contrôles qu'axe ne fait
  # pas (cibles tactiles de 48px, parcours clavier, retour arrière du navigateur).
  # Job séparé des contrôles de données : ses dépendances sont plus lourdes et son
  # échec se lit indépendamment.
  # Règle commune « CI, trois niveaux » (16/11/2026) : une PR qui ne touche que des .md n'a rien à donner aux contrôles
  # lourds, qui sont alors marqués « sautés » (un job sauté compte comme réussi pour les contrôles obligatoires).
  # Sur main et au lancement manuel, tout tourne toujours.
  changements:
    name: Fichiers touchés
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.tri.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: tri
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # Le commit de fusion d'une PR a pour premier parent la pointe de main : leur écart est exactement la PR.
          fichiers=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$fichiers"
          if printf '%s\n' "$fichiers" | grep -qvE '\.md$'; then echo code=true; else echo code=false; fi >> "$GITHUB_OUTPUT"

  accessibilite:
    needs: changements
    if: needs.changements.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Installation de Chromium
        # Sans --with-deps : l'image ubuntu-latest a déjà les bibliothèques de Chromium, et l'étape apt
        # du miroir Azure se figeait parfois plusieurs minutes (deux jobs annulés sans qu'aucun test ne
        # tourne). Seul le navigateur est téléchargé, depuis le CDN de Playwright.
        run: npx playwright install chromium

      - name: Contrôles d'accessibilité
        run: npx playwright test

      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7
