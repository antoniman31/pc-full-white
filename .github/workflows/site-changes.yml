name: Changements du site

# Les changements saisis sur la page (achats, prix, ajouts, suppressions) arrivent dans une Pull Request
# `site-changes/…` qui contient data/changes.json. Deux travaux :
#   appliquer    sur cette PR : applique changes.json à prices.json, contrôle, et commit le résultat
#   rafraichir   à chaque push sur main : remet à jour les PR `site-changes/…` encore ouvertes
#                (par exemple quand un relevé de prix a été fusionné entre-temps)
#
# Un push signé par le GITHUB_TOKEN ne déclenche aucun workflow : les contrôles sont donc refaits ici,
# avant le push, comme dans update-prices.yml.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths: [data/changes.json]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Jamais deux écritures en même temps sur ces branches.
concurrency:
  group: changements-site
  cancel-in-progress: false

jobs:
  appliquer:
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.event.pull_request.head.ref, 'site-changes/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Appliquer changes.json à prices.json
        run: python3 scripts/apply_changes.py

      - name: Contrôler la cohérence
        run: python3 scripts/check_prices.py data/prices.json

      - name: Enregistrer le résultat sur la branche
        run: |
          if git diff --quiet data/prices.json; then
            echo "prices.json contient déjà ces changements."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/prices.json
            git commit -m "chore: prices.json recalculé avec les changements du site"
            git push
          fi

  rafraichir:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Remettre à jour les PR de changements encore ouvertes
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          main_head=$(git rev-parse HEAD)
          gh pr list --state open --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | select(.headRefName | startswith("site-changes/")) | "\(.number) \(.headRefName)"' |
          while read -r num branch; do
            echo "== PR $num ($branch)"
            git fetch -q origin "$branch" && git checkout -q -B "$branch" "origin/$branch" || { echo "branche illisible"; continue; }
            if git merge-base --is-ancestor "$main_head" HEAD; then echo "déjà à jour"; continue; fi
            if ! git merge --no-edit "$main_head"; then
              # prices.json : la version de main (le recalcul la reconstruit) ; changes.json : celle de la PR.
              git checkout --theirs data/prices.json 2>/dev/null && git add data/prices.json
              git checkout --ours data/changes.json 2>/dev/null && git add data/changes.json
              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                git merge --abort
                gh pr comment "$num" --body "$(printf '%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_' 'Conflit avec main que je ne sais pas résoudre automatiquement : à régler à la main.')"
                continue
              fi
              git commit -q --no-edit
            fi
            python3 scripts/apply_changes.py && python3 scripts/check_prices.py data/prices.json || { echo "contrôle rouge : branche non poussée"; continue; }
            git add data/prices.json
            git diff --cached --quiet || git commit -q -m "chore: prices.json recalculé après mise à jour depuis main"
            git push -q origin "HEAD:$branch" || echo "push refusé"
          done
