name: Relevé des prix

# Deux passages par mois : le 1er et le 15 à 7h UTC (8h ou 9h à Paris selon la saison).
# Lançable aussi à la main (onglet Actions, « Run workflow »), en quatre modes :
#   releve      relevé complet : écrit les prix et ouvre une Pull Request (mode des passages auto)
#   essai       même chose sans rien écrire : le rapport s'affiche dans le résumé du job
#   decouverte  cherche des fiches produit par nom chez les revendeurs, ouvre une PR sur sources.json
#   essai-decouverte  même chose sans rien écrire (pas de PR) : pour voir ce que la découverte trouverait
#   sonde       teste des adresses (champ « adresses ») et affiche ce que le script y lit
#
# Le script ne commit jamais directement sur main : il ouvre une Pull Request, pour qu'un vrai
# prix erroné (page mal lue, site qui a changé de structure) ne parte jamais en ligne sans relecture.
on:
  schedule:
    - cron: "0 7 1,15 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "releve · essai · decouverte · essai-decouverte · sonde"
        type: choice
        options: [releve, essai, decouverte, essai-decouverte, sonde]
        default: releve
      articles:
        description: "Articles (essai, découverte) : identifiants séparés par des virgules, ex : cpu,gpu"
        required: false
      revendeurs:
        description: "Revendeurs (découverte) : ids séparés par des virgules, ex : ldlc,grosbill"
        required: false
      adresses:
        description: "Adresses à tester (sonde), séparées par des espaces"
        required: false

permissions:
  contents: write
  pull-requests: write

# Deux relevés ne doivent jamais s'écrire l'un sur l'autre.
concurrency:
  group: releve-prix
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Les saisies passent par l'environnement, jamais interpolées dans le script : une valeur
    # saisie dans le formulaire ne peut pas devenir une commande.
    env:
      MODE: ${{ inputs.mode || 'releve' }}
      ARTICLES: ${{ inputs.articles }}
      REVENDEURS: ${{ inputs.revendeurs }}
      ADRESSES: ${{ inputs.adresses }}
    steps:
      - name: Récupérer le repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Installer les dépendances
        run: pip install -r scraper/requirements.txt

      - name: Tests du scraper
        if: env.MODE == 'releve'
        run: python3 -m unittest discover -s scraper/tests

      - name: Lancer
        env:
          # Clé SerpApi (Google Shopping) : absente = le complément Shopping est simplement désactivé.
          # Elle n'est donnée qu'à cette étape, jamais aux autres.
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          set -euo pipefail
          only=(); [ -n "$ARTICLES" ] && only=(--only "$ARTICLES")
          ret=();  [ -n "$REVENDEURS" ] && ret=(--retailers "$REVENDEURS")
          case "$MODE" in
            releve)     python3 scraper/update_prices.py --report rapport.md ;;
            essai)      python3 scraper/update_prices.py --dry-run --report rapport.md "${only[@]}" ;;
            decouverte) python3 scraper/update_prices.py --discover --report rapport.md "${only[@]}" "${ret[@]}" ;;
            essai-decouverte) python3 scraper/update_prices.py --discover --dry-run --report rapport.md "${only[@]}" "${ret[@]}" ;;
            sonde)      python3 scraper/update_prices.py --probe $ADRESSES ;;
            *)          echo "mode inconnu : $MODE"; exit 2 ;;
          esac

      - name: Rapport dans le résumé du job
        if: always() && hashFiles('rapport.md') != ''
        run: cat rapport.md >> "$GITHUB_STEP_SUMMARY"

      # Une PR ouverte avec le GITHUB_TOKEN par défaut ne déclenche AUCUN workflow
      # pull_request : checks.yml ne tourne donc jamais sur cette PR. Le contrôle est refait
      # ici, avant l'ouverture, et son résultat part dans la description. continue-on-error :
      # un contrôle rouge ne doit pas empêcher d'ouvrir la PR, il la fait ouvrir EN BROUILLON
      # (non fusionnable tant qu'elle n'est pas relue).
      - name: Contrôler la cohérence des données
        id: coherence
        if: env.MODE == 'releve'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/check_prices.py data/prices.json 2>&1 | tee check.log

      - name: Vérifier s'il y a des changements
        id: check
        if: env.MODE == 'releve' || env.MODE == 'decouverte'
        run: |
          if git diff --quiet data/prices.json scraper/sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la description de la Pull Request
        if: steps.check.outputs.changed == 'true' && env.MODE == 'releve'
        run: |
          {
            echo "**À vérifier avant de fusionner :** que chaque nouveau prix est plausible"
            echo "(pas de page mal lue, pas de prix d'accessoire au lieu du produit principal)."
            echo
            if [ "${{ steps.coherence.outcome }}" = "success" ]; then
              echo "✅ **Contrôle de cohérence : réussi.**"
            else
              echo "❌ **Contrôle de cohérence : échoué.** La PR est ouverte en brouillon : ne pas"
              echo "la fusionner avant d'avoir compris pourquoi. Le script recalcule lui-même les"
              echo "totaux, donc un échec ici signale une incohérence réelle ou un défaut du script."
              echo
              echo '```'
              cat check.log
              echo '```'
            fi
            echo
            cat rapport.md
          } > pr-body.md

      - name: Ouvrir la Pull Request du relevé
        if: steps.check.outputs.changed == 'true' && env.MODE == 'releve'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: relevé des prix (${{ github.run_id }})"
          title: "Relevé des prix — à relire avant fusion"
          body-path: pr-body.md
          draft: ${{ steps.coherence.outcome != 'success' }}
          branch: prix/releve
          delete-branch: true
          add-paths: data/prices.json

      - name: Ouvrir la Pull Request de la découverte
        if: steps.check.outputs.changed == 'true' && env.MODE == 'decouverte'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore: nouvelles fiches produit (${{ github.run_id }})"
          title: "Découverte de fiches produit — à relire avant fusion"
          body-path: rapport.md
          branch: prix/decouverte
          delete-branch: true
          add-paths: scraper/sources.json

      - name: Conserver le rapport
        if: always() && hashFiles('rapport.md') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapport-${{ env.MODE }}
          path: rapport.md
          retention-days: 30
