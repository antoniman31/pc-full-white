name: Vérification mensuelle des prix

# Tourne automatiquement le 1er de chaque mois à 8h (heure de Paris, ~ 6h/7h UTC selon saison).
# Peut aussi être lancé manuellement depuis l'onglet Actions de GitHub ("Run workflow").
#
# Le scraper ne commit jamais directement sur main : il ouvre une Pull Request,
# pour qu'un vrai prix erroné (page mal parsée, site qui a changé de structure)
# ne parte jamais en ligne sans qu'un humain l'ait relu.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Lancer le scraper
        run: python3 scraper/update_prices.py

      # Une PR ouverte avec le GITHUB_TOKEN par défaut ne déclenche AUCUN workflow
      # pull_request : checks.yml ne tourne donc jamais sur cette PR. Le contrôle
      # est refait ici, avant l'ouverture, et son résultat part dans la description.
      # continue-on-error : un contrôle rouge ne doit pas empêcher d'ouvrir la PR,
      # il la fait ouvrir EN BROUILLON (non fusionnable tant qu'elle n'est pas relue).
      - name: Contrôler la cohérence des données
        id: coherence
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/check_prices.py data/prices.json 2>&1 | tee check.log

      - name: Vérifier s'il y a des changements
        id: check
        run: |
          if git diff --quiet data/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparer la description de la Pull Request
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo "Le scraper mensuel a détecté des changements de prix."
            echo
            echo "**À vérifier avant de fusionner :** que chaque nouveau prix est plausible"
            echo "(pas de page mal parsée, pas de prix d'accessoire au lieu du produit principal)."
            echo
            if [ "${{ steps.coherence.outcome }}" = "success" ]; then
              echo "✅ **Contrôle de cohérence : réussi.**"
            else
              echo "❌ **Contrôle de cohérence : échoué.** La PR est ouverte en brouillon."
              echo
              echo "Le scraper ne recalcule ni \`budget_summary\` ni l'historique : un écart sur"
              echo "les totaux après un vrai changement de prix est attendu, à corriger à la main."
              echo "Une valeur à 0 ou absente, en revanche, signale une page mal lue."
            fi
            echo
            echo '```'
            cat check.log
            echo '```'
            echo
            echo "Voir le détail des changements dans le diff ci-dessous."
          } > pr-body.md

      - name: Ouvrir une Pull Request avec les changements
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: "chore: vérification mensuelle des prix (${{ github.run_id }})"
          title: "Vérification mensuelle des prix — à relire avant fusion"
          body-path: pr-body.md
          draft: ${{ steps.coherence.outcome != 'success' }}
          branch: prix/verification-mensuelle
          delete-branch: true
          add-paths: data/prices.json
